# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem acesso.
# Este workflow faz uma consulta simples a cada 3 dias para mantê-lo ativo.
# Requer os secrets SUPABASE_URL e SUPABASE_ANON_KEY
# (GitHub → Settings → Secrets and variables → Actions).
name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL e SUPABASE_ANON_KEY não configurados; nada a fazer."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/limites?select=mes&limit=1"
